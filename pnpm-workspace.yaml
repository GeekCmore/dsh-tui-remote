packages:
  - .
  - vendor/dsh-remote/packages/fs-ssh
  - vendor/dsh-remote/packages/live-runtime
  - vendor/dsh-remote/packages/remote
  - vendor/dsh-remote/packages/remote-core
  - vendor/dsh-remote/packages/remote-frontend
  - vendor/dsh-remote/packages/remote-ssh
  - vendor/dsh-remote/packages/seams
  - vendor/dsh-remote/packages/subprocess-ssh
  - vendor/dsh-remote/packages/test-utils

onlyBuiltDependencies:
  - esbuild
allowBuilds:
  cpu-features: false
  esbuild: true
  ssh2: false
minimumReleaseAgeExclude:
  - '@deepseek-harness-tui/dsh-tui@0.8.0'
  - dsh-working-activity@0.2.6
